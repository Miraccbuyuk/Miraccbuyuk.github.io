<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-posta Onaylandı - Kocify KPSS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            background-color: white;
            padding: 50px 40px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 90%;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-container {
            width: 84px;
            height: 84px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 28px auto;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s both;
        }

        @keyframes popIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .icon-container svg {
            width: 44px;
            height: 44px;
            color: white;
        }

        h1 {
            color: #1f2937;
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 16px 0;
            letter-spacing: -0.5px;
        }

        p {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.6;
            margin: 0 0 16px 0;
        }

        .success-box {
            background-color: #f3f4f6;
            border-radius: 16px;
            padding: 16px;
            margin-top: 24px;
            color: #4b5563;
            font-size: 15px;
            font-weight: 600;
        }
        
        .footer {
            margin-top: 32px;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <h1>Tebrikler!</h1>
        <p>E-posta adresiniz başarıyla doğrulandı. Artık KPSS sürecindeki en büyük yardımcınızla çalışmaya başlayabilirsiniz.</p>
        
        <div class="success-box">
            Bu sayfayı kapatıp Kocify KPSS uygulamasına geri dönebilirsiniz.
        </div>
        
        <div class="footer">
            Kocify KPSS - Başarıya giden yolda...
        </div>
    </div>
</body>
</html>
